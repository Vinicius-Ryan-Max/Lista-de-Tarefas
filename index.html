<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas Pro</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.7);
    }
    .task-enter {
      animation: slideIn 0.25s ease-out forwards;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

  <!-- Cabeçalho / Container Principal -->
  <div class="w-full max-w-2xl mx-auto px-4 py-8 md:py-12 flex-grow flex flex-col">
    
    <!-- Topbar: Título & Botão Modo Escuro -->
    <header class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
          <i class="fa-solid fa-check-double text-xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Minhas Tarefas</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400" id="current-date">Organize o seu dia</p>
        </div>
      </div>

      <button id="theme-toggle" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 shadow-sm border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all duration-200" title="Alternar Tema">
        <i class="fa-solid fa-moon text-lg dark:hidden"></i>
        <i class="fa-solid fa-sun text-lg hidden dark:block text-amber-400"></i>
      </button>
    </header>

    <!-- Card Principal -->
    <main class="bg-white dark:bg-slate-800/90 backdrop-blur-md rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700/60 overflow-hidden flex flex-col flex-grow">
      
      <!-- Barra de Barra de Progresso -->
      <div class="p-5 border-b border-slate-100 dark:border-slate-700/60 bg-slate-50/50 dark:bg-slate-800/50">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Progresso Geral</span>
          <span id="progress-percentage" class="text-xs font-bold text-brand-600 dark:text-brand-500">0%</span>
        </div>
        <div class="w-full h-2.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-full bg-brand-500 transition-all duration-500 ease-out w-0 rounded-full"></div>
        </div>
      </div>

      <!-- Formulário para Adicionar Tarefa -->
      <form id="todo-form" class="p-4 md:p-6 border-b border-slate-100 dark:border-slate-700/60 flex gap-2">
        <div class="relative flex-grow">
          <input 
            type="text" 
            id="todo-input" 
            placeholder="O que você precisa fazer hoje?" 
            class="w-full pl-4 pr-10 py-3.5 bg-slate-100 dark:bg-slate-900/60 border border-transparent dark:border-slate-700 rounded-xl focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 transition-all text-sm md:text-base"
            maxlength="120"
            required
          >
          <span id="char-counter" class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 pointer-events-none hidden md:inline">0/120</span>
        </div>
        <button 
          type="submit" 
          class="bg-brand-500 hover:bg-brand-600 active:scale-95 text-white px-5 md:px-6 py-3.5 rounded-xl font-medium shadow-md shadow-brand-500/20 transition-all flex items-center gap-2 text-sm md:text-base shrink-0"
        >
          <i class="fa-solid fa-plus"></i>
          <span class="hidden sm:inline">Adicionar</span>
        </button>
      </form>

      <!-- Filtros de Navegação -->
      <div class="flex items-center justify-between px-4 md:px-6 py-3 border-b border-slate-100 dark:border-slate-700/60 bg-slate-50/30 dark:bg-slate-800/30 text-sm">
        <div class="flex gap-1 bg-slate-200/60 dark:bg-slate-900/60 p-1 rounded-xl" id="filter-buttons">
          <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-xs md:text-sm transition-all bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm">Todas</button>
          <button data-filter="pending" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-xs md:text-sm transition-all text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">Pendentes</button>
          <button data-filter="completed" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-xs md:text-sm transition-all text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">Concluídas</button>
        </div>

        <span id="items-left" class="text-xs text-slate-500 dark:text-slate-400 font-medium">0 pendentes</span>
      </div>

      <!-- Lista de Tarefas (Scrollável) -->
      <div class="flex-grow min-h-[250px] max-h-[420px] overflow-y-auto custom-scrollbar p-4 md:p-6">
        <ul id="todo-list" class="space-y-2.5">
          <!-- As tarefas serão inseridas dinamicamente aqui -->
        </ul>

        <!-- Estado Vazio (Empty State) -->
        <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center py-12 hidden">
          <div class="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-700/50 flex items-center justify-center text-slate-400 dark:text-slate-500 mb-3">
            <i class="fa-regular fa-clipboard text-2xl"></i>
          </div>
          <p class="text-slate-600 dark:text-slate-300 font-medium text-sm">Nenhuma tarefa encontrada</p>
          <p class="text-slate-400 dark:text-slate-500 text-xs mt-1">Adicione algo à sua lista para começar!</p>
        </div>
      </div>

      <!-- Rodapé do Card -->
      <div class="p-4 border-t border-slate-100 dark:border-slate-700/60 bg-slate-50/50 dark:bg-slate-800/50 flex justify-between items-center text-xs">
        <button id="clear-completed" class="text-slate-500 dark:text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 font-medium transition-colors flex items-center gap-1.5">
          <i class="fa-regular fa-trash-can"></i>
          Limpar Concluídas
        </button>
        <button id="clear-all" class="text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 font-normal transition-colors">
          Excluir Tudo
        </button>
      </div>
    </main>

    <!-- Rodapé da Página -->
    <footer class="mt-8 text-center text-xs text-slate-400 dark:text-slate-600">
      <p>Suas tarefas são salvas automaticamente no navegador.</p>
    </footer>

  </div>

  <!-- Componente de Notificação / Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none z-50 text-sm font-medium">
    <i id="toast-icon" class="fa-solid fa-circle-check text-brand-500"></i>
    <span id="toast-message">Notificação</span>
  </div>

  <!-- Código JavaScript -->
  <script>
    // Inicialização do Estado
    let todos = JSON.parse(localStorage.getItem('todos_app_data')) || [];
    let currentFilter = 'all';

    // Elementos do DOM
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const itemsLeft = document.getElementById('items-left');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const clearCompletedBtn = document.getElementById('clear-completed');
    const clearAllBtn = document.getElementById('clear-all');
    const themeToggleBtn = document.getElementById('theme-toggle');
    const currentDateEl = document.getElementById('current-date');
    const progressBar = document.getElementById('progress-bar');
    const progressPercentage = document.getElementById('progress-percentage');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');
    const toastIcon = document.getElementById('toast-icon');

    // Configurar Data Atual
    function setCurrentDate() {
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const today = new Date();
      const formattedDate = today.toLocaleDateString('pt-BR', options);
      currentDateEl.textContent = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
    }

    // Gerenciamento de Tema (Modo Escuro / Claro)
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      showToast(isDark ? 'Modo Escuro ativado' : 'Modo Claro ativado', 'fa-moon');
    });

    // Salvar Tarefas no LocalStorage
    function saveTodos() {
      localStorage.setItem('todos_app_data', JSON.stringify(todos));
      updateUI();
    }

    // Exibir Notificação Toast
    let toastTimeout;
    function showToast(message, iconClass = 'fa-circle-check') {
      toastMessage.textContent = message;
      toastIcon.className = `fa-solid ${iconClass} text-brand-500`;
      
      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 2500);
    }

    // Renderizar Lista de Tarefas
    function renderTodos() {
      todoList.innerHTML = '';

      const filteredTodos = todos.filter(todo => {
        if (currentFilter === 'pending') return !todo.completed;
        if (currentFilter === 'completed') return todo.completed;
        return true;
      });

      if (filteredTodos.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
      }

      filteredTodos.forEach(todo => {
        const li = document.createElement('li');
        li.className = `task-enter group flex items-center justify-between p-3.5 rounded-xl border transition-all ${
          todo.completed 
            ? 'bg-slate-50/60 dark:bg-slate-900/40 border-slate-100 dark:border-slate-800 text-slate-400 dark:text-slate-500' 
            : 'bg-white dark:bg-slate-800 border-slate-200/80 dark:border-slate-700/80 text-slate-800 dark:text-slate-100 shadow-sm hover:border-brand-500/50'
        }`;

        li.innerHTML = `
          <div class="flex items-center gap-3 min-w-0 flex-grow pr-2">
            <button 
              onclick="toggleTodo('${todo.id}')"
              class="w-5 h-5 rounded-md border flex items-center justify-center transition-all shrink-0 ${
                todo.completed 
                  ? 'bg-brand-500 border-brand-500 text-white' 
                  : 'border-slate-300 dark:border-slate-600 hover:border-brand-500'
              }"
              aria-label="${todo.completed ? 'Marcar como pendente' : 'Marcar como concluída'}"
            >
              ${todo.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
            </button>
            <span class="text-sm md:text-base font-normal truncate select-none ${todo.completed ? 'line-through opacity-75' : ''}">
              ${escapeHtml(todo.text)}
            </span>
          </div>

          <div class="flex items-center gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
            <button 
              onclick="deleteTodo('${todo.id}')" 
              class="p-1.5 text-slate-400 hover:text-rose-500 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-colors"
              title="Excluir tarefa"
            >
              <i class="fa-regular fa-trash-can text-sm"></i>
            </button>
          </div>
        `;

        todoList.appendChild(li);
      });
    }

    // Função utilitária para evitar inserção de HTML (XSS Security)
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Atualizar Contadores e Barra de Progresso
    function updateUI() {
      const pendingCount = todos.filter(t => !t.completed).length;
      const completedCount = todos.filter(t => t.completed).length;
      const totalCount = todos.length;

      // Contador de pendentes
      itemsLeft.textContent = `${pendingCount} ${pendingCount === 1 ? 'pendente' : 'pendentes'}`;

      // Barra de progresso
      const percentage = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);
      progressBar.style.width = `${percentage}%`;
      progressPercentage.textContent = `${percentage}%`;

      renderTodos();
    }

    // Adicionar Tarefa
    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();

      if (text) {
        const newTodo = {
          id: Date.now().toString(),
          text: text,
          completed: false,
          createdAt: new Date()
        };

        todos.unshift(newTodo);
        saveTodos();
        todoInput.value = '';
        showToast('Tarefa adicionada com sucesso!');
      }
    });

    // Alternar Conclusão da Tarefa
    window.toggleTodo = function(id) {
      todos = todos.map(todo => {
        if (todo.id === id) {
          const newState = !todo.completed;
          if (newState) showToast('Tarefa concluída!', 'fa-check-circle');
          return { ...todo, completed: newState };
        }
        return todo;
      });
      saveTodos();
    };

    // Deletar Tarefa
    window.deleteTodo = function(id) {
      todos = todos.filter(todo => todo.id !== id);
      saveTodos();
      showToast('Tarefa removida.', 'fa-trash');
    };

    // Filtros (Todas, Pendentes, Concluídas)
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => {
          b.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-800', 'dark:text-slate-100', 'shadow-sm');
          b.classList.add('text-slate-500', 'dark:text-slate-400');
        });

        btn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-800', 'dark:text-slate-100', 'shadow-sm');
        btn.classList.remove('text-slate-500', 'dark:text-slate-400');

        currentFilter = btn.getAttribute('data-filter');
        renderTodos();
      });
    });

    // Limpar Tarefas Concluídas
    clearCompletedBtn.addEventListener('click', () => {
      const completedCount = todos.filter(t => t.completed).length;
      if (completedCount === 0) {
        showToast('Nenhuma tarefa concluída para limpar.', 'fa-circle-info');
        return;
      }

      todos = todos.filter(t => !t.completed);
      saveTodos();
      showToast('Tarefas concluídas removidas.');
    });

    // Excluir Tudo
    clearAllBtn.addEventListener('click', () => {
      if (todos.length === 0) return;
      
      if (confirm('Tem certeza de que deseja excluir TODAS as tarefas?')) {
        todos = [];
        saveTodos();
        showToast('Todas as tarefas foram limpas.');
      }
    });

    // Inicializar Aplicativo
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      setCurrentDate();
      updateUI();
    });
  </script>
</body>
</html>
